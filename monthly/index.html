<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Ecommerce Bookkeeping for UK Sellers | EcomKeeping</title>
  <meta name="description" content="Monthly bookkeeping for UK ecommerce businesses selling on Amazon, Shopify and other channels. Clear reports, stock and cost of sales tracking, and personal support." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1E3A8A; --navy-dark: #152c6b; --navy-mid: #2d4fa8;
      --emerald: #10B981; --emerald-dark: #059669; --emerald-light: #D1FAE5;
      --white: #FFFFFF; --slate: #64748B; --slate-light: #94A3B8;
      --charcoal: #1F2937; --light-bg: #F8FAFF; --border: #E2E8F0;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; color: var(--charcoal); background: var(--white); line-height: 1.65; overflow-x: hidden; }
    h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1060px; margin: 0 auto; padding: 0 5%; }
    .eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--emerald); margin-bottom: 0.5rem; }
    .section-heading { font-size: clamp(1.6rem, 3.2vw, 2.2rem); font-weight: 800; color: var(--navy); line-height: 1.2; margin-bottom: 0.8rem; letter-spacing: -0.02em; }
    .fade-up { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .fade-up.visible { opacity: 1; transform: none; }
    nav { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 5%; height: 62px; display: flex; align-items: center; justify-content: space-between; }
    .nav-brand { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.15rem; color: var(--navy); }
    .nav-brand span { color: var(--emerald); }
    .nav-back { font-size: 0.82rem; color: var(--slate); display: flex; align-items: center; gap: 0.35rem; transition: color 0.2s; }
    .nav-back:hover { color: var(--navy); }
    .hero { background: linear-gradient(150deg, #0f2360 0%, var(--navy) 50%, #1a4ea8 100%); padding: 80px 5% 70px; text-align: center; position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 50%, rgba(16,185,129,0.12) 0%, transparent 65%); pointer-events: none; }
    .hero-inner { max-width: 740px; margin: 0 auto; position: relative; }
    .hero-pill { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(16,185,129,0.18); border: 1px solid rgba(16,185,129,0.35); color: #6EE7B7; border-radius: 50px; padding: 0.35rem 1rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 1.5rem; }
    .hero-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); flex-shrink: 0; }
    .hero h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); font-weight: 900; color: var(--white); line-height: 1.12; margin-bottom: 1.2rem; letter-spacing: -0.025em; }
    .hero h1 em { color: var(--emerald); font-style: normal; }
    .hero-desc { font-size: 1.05rem; color: rgba(255,255,255,0.75); line-height: 1.75; margin-bottom: 2.2rem; max-width: 580px; margin-left: auto; margin-right: auto; }
    .hero-cta { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--emerald); color: var(--white); padding: 0.95rem 2.2rem; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1rem; box-shadow: 0 4px 24px rgba(16,185,129,0.45); transition: all 0.2s; }
    .hero-cta:hover { background: var(--emerald-dark); transform: translateY(-2px); }
    .hero-cta-note { font-size: 0.78rem; color: rgba(255,255,255,0.45); margin-top: 0.7rem; }
    .hero-stats { display: flex; align-items: center; justify-content: center; gap: 2.5rem; margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap; }
    .hero-stat { text-align: center; }
    .hero-stat-num { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.5rem; color: var(--emerald); }
    .hero-stat-label { font-size: 0.72rem; color: rgba(255,255,255,0.5); margin-top: 0.15rem; }
    .intro { padding: 80px 5%; background: var(--light-bg); }
    .intro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5rem; align-items: start; margin-top: 2.5rem; }
    .intro-text p { font-size: 0.95rem; color: var(--slate); line-height: 1.8; margin-bottom: 1rem; }
    .intro-text p strong { color: var(--charcoal); font-weight: 600; }
    .intro-callout { background: linear-gradient(145deg, var(--navy), var(--navy-mid)); border-radius: 14px; padding: 2.2rem; color: var(--white); }
    .intro-callout h3 { font-size: 1.05rem; margin-bottom: 1.2rem; line-height: 1.4; }
    .ic-list { list-style: none; display: flex; flex-direction: column; gap: 0.7rem; }
    .ic-list li { font-size: 0.87rem; color: rgba(255,255,255,0.8); display: flex; gap: 0.6rem; align-items: flex-start; line-height: 1.5; }
    .ic-list li::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); flex-shrink: 0; margin-top: 0.45rem; }
    .deliverables { padding: 80px 5%; background: var(--white); }
    .del-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; margin-top: 2.5rem; }
    .del-card { background: var(--light-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; transition: box-shadow 0.2s; }
    .del-card:hover { box-shadow: 0 3px 16px rgba(30,58,138,0.08); }
    .del-icon { font-size: 1.4rem; margin-bottom: 0.7rem; }
    .del-card h4 { font-size: 0.9rem; color: var(--navy); margin-bottom: 0.4rem; }
    .del-card p { font-size: 0.81rem; color: var(--slate); line-height: 1.6; }
    .how { padding: 80px 5%; background: var(--light-bg); }
    .how-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.3rem; margin-top: 3rem; }
    .how-step { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 1.6rem; }
    .how-num { width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: var(--white); font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1rem; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; }
    .how-step.free-step .how-num { background: var(--emerald); }
    .free-badge { display: inline-block; background: #ECFDF5; color: #065F46; font-size: 0.62rem; font-weight: 700; padding: 0.13rem 0.45rem; border-radius: 3px; border: 1px solid #A7F3D0; letter-spacing: 0.04em; margin-bottom: 0.5rem; }
    .how-step h4 { font-size: 0.9rem; color: var(--navy); margin-bottom: 0.5rem; line-height: 1.3; }
    .how-step p { font-size: 0.81rem; color: var(--slate); line-height: 1.6; }
    .pricing { padding: 80px 5%; background: var(--white); }
    .pricing-intro { max-width: 600px; margin-bottom: 2.5rem; }
    .discount-banner { background: linear-gradient(135deg, #ECFDF5, #D1FAE5); border: 1px solid rgba(16,185,129,0.3); border-radius: 10px; padding: 1.1rem 1.6rem; margin-bottom: 2.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .db-badge { background: var(--emerald); color: var(--white); font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 0.82rem; padding: 0.3rem 0.8rem; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
    .db-text { font-size: 0.88rem; color: #065F46; line-height: 1.5; }
    .db-text strong { font-weight: 700; }
    .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .plan { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
    .plan:last-child { border-right: none; }
    .plan-header { padding: 1.8rem 1.8rem 1.4rem; border-bottom: 1px solid var(--border); }
    .plan.starter .plan-header { background: var(--light-bg); }
    .plan.growth .plan-header { background: linear-gradient(135deg, #F0FDF9, #ECFDF5); border-bottom-color: rgba(16,185,129,0.15); }
    .plan.scale .plan-header { background: linear-gradient(135deg, #1E3A8A, #2d5cc8); }
    .plan-tier-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--slate); margin-bottom: 0.2rem; }
    .plan.growth .plan-tier-label { color: var(--emerald-dark); }
    .plan.scale .plan-tier-label { color: rgba(255,255,255,0.55); }
    .plan-name { font-size: 1.3rem; font-weight: 900; color: var(--navy); margin-bottom: 0.3rem; }
    .plan.scale .plan-name { color: var(--white); }
    .plan-amount { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 2.2rem; color: var(--navy); line-height: 1; }
    .plan.scale .plan-amount { color: var(--white); }
    .plan-amount sup { font-size: 1rem; vertical-align: top; margin-top: 0.45rem; display: inline-block; }
    .plan-amount sub { font-size: 0.8rem; font-weight: 500; color: var(--slate); }
    .plan.scale .plan-amount sub { color: rgba(255,255,255,0.55); }
    .plan-first-month { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.4rem; margin-bottom: 0.5rem; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); border-radius: 5px; padding: 0.25rem 0.6rem; width: fit-content; }
    .plan.scale .plan-first-month { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
